components:
  securitySchemes:
    PlayerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Audiência clicklance-player; sessão durável de 60 minutos, sem permissões administrativas.
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256; sessão, usuário e vínculo ativos; validade absoluta de 60 minutos.
    DeviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: Credencial vinculada ao dispositivo, não à identidade administrativa.
  parameters:
    EmpresaId:
      name: empresa_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OriginId'}
    QuadraId:
      name: quadra_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OriginId'}
    DispositivoId:
      name: dispositivo_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DeviceId'}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  headers:
    CorrelationId:
      description: UUID gerado pelo servidor; igual a correlation_id no corpo de erro. Header recebido nao e reutilizado.
      schema: {type: string, format: uuid}
    RetryAfter:
      description: Segundos até nova tentativa; sem mudança de identidade do evento
      schema: {type: integer, minimum: 1}
  responses:
    BadRequest:
      description: JSON/header/caminho malformado; INVALID_REQUEST
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: Credencial ausente/inválida, sessão expirada/revogada ou usuário inativo; UNAUTHENTICATED
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        WWW-Authenticate:
          description: Bearer somente para a API administrativa; não tratar DeviceToken como Bearer
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Papel/vínculo/origem sem permissão; FORBIDDEN ou ORIGIN_INACTIVE
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Recurso inexistente no escopo autorizado; RESOURCE_NOT_FOUND
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Identidade/conteúdo/versão em conflito; IDENTITY_CONFLICT, CONTENT_CONFLICT ou CONFIG_VERSION_CONFLICT
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unprocessable:
      description: Campo fora do domínio; VALIDATION_FAILED ou EVENT_IN_FUTURE
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    RateLimited:
      description: Limite de requisições; RATE_LIMITED
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unavailable:
      description: Dependência, objeto ou configuração indisponível; DEPENDENCY_UNAVAILABLE, OBJECT_NOT_READY ou CONFIGURATION_NOT_READY
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InternalError:
      description: Falha inesperada; INTERNAL_ERROR, sem detalhes internos
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    PlayerCredentials:
      $ref: '#/components/schemas/AdminLogin'
    PlayerIdentity:
      type: object
      additionalProperties: false
      required:
      - usuario_id
      - email
      properties:
        usuario_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    PlayerRecovery:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
    PlayerReset:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          description: 12–72 bytes UTF-8; não truncar.
    RecoveryAccepted:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          const: Se a conta estiver elegivel, enviaremos as instrucoes de recuperacao.
    ArenaSummary:
      type: object
      additionalProperties: false
      required:
      - empresa_id
      - nome
      properties:
        empresa_id:
          $ref: '#/components/schemas/OriginId'
        nome:
          $ref: '#/components/schemas/NonBlankName'
    CourtSummary:
      type: object
      additionalProperties: false
      required:
      - quadra_id
      - nome
      - timezone
      properties:
        quadra_id:
          $ref: '#/components/schemas/OriginId'
        nome:
          $ref: '#/components/schemas/NonBlankName'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    ReplaySummary:
      type: object
      additionalProperties: false
      required:
      - evento_id
      - empresa_id
      - quadra_id
      - timestamp
      - expira_em
      - salvo
      properties:
        evento_id:
          $ref: '#/components/schemas/EventoId'
        empresa_id:
          $ref: '#/components/schemas/OriginId'
        quadra_id:
          $ref: '#/components/schemas/OriginId'
        timestamp: &schemaid001
          type: string
          format: date-time
        expira_em: *schemaid001
        salvo: &schemaid003
          type: boolean
    ArenaPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArenaSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    CourtDiscoveryPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourtSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    ReplayPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReplaySummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Availability:
      type: object
      additionalProperties: false
      required:
      - quadra_id
      - timezone
      - hoje
      - data
      - datas
      - slots
      - page
      - size
      properties:
        quadra_id:
          $ref: '#/components/schemas/OriginId'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        hoje: &schemaid002
          type: string
          format: date
        data: *schemaid002
        datas:
          type: array
          items: *schemaid002
        slots:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - hora_inicio
            - hora_fim
            - total
            properties:
              hora_inicio:
                type: integer
                minimum: 0
                maximum: 23
              hora_fim:
                type: integer
                minimum: 1
                maximum: 24
              total:
                type: integer
                minimum: 1
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
    MediaRequest:
      type: object
      additionalProperties: false
      required:
      - download
      properties:
        download: *schemaid003
    MediaAccess:
      type: object
      additionalProperties: false
      required:
      - url
      - expira_em
      properties:
        url:
          type: string
          format: uri
        expira_em: *schemaid001
    ReplayBlock:
      type: object
      additionalProperties: false
      required:
      - blocked
      - reason
      properties:
        blocked: *schemaid003
        reason:
          type: string
          enum:
          - POLICY
          - PRIVACY
          - OPERATIONAL
    ReplayBlockResult:
      type: object
      additionalProperties: false
      required:
      - evento_id
      - blocked
      properties:
        evento_id:
          $ref: '#/components/schemas/EventoId'
        blocked: *schemaid003
    BatchLimit:
      type: object
      additionalProperties: false
      required:
      - limit
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
    PurgeReservationResult:
      type: object
      additionalProperties: false
      required:
      - reserved
      properties:
        reserved:
          type: integer
          minimum: 0
    PurgeRunResult:
      type: object
      additionalProperties: false
      required:
      - completed
      - failed
      properties:
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
    ReconciliationResult:
      type: object
      additionalProperties: false
      required:
      - orphan_objects
      - missing_objects
      - purged_objects
      properties:
        purged_objects:
          type: integer
          minimum: 0
        orphan_objects:
          type: integer
          minimum: 0
        missing_objects:
          type: integer
          minimum: 0
    ReconciliationIssue:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - first_seen_at
      - last_seen_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - ORPHAN_OBJECT
          - MISSING_OBJECT
          - PURGED_OBJECT_PRESENT
        first_seen_at: *schemaid001
        last_seen_at: *schemaid001
    HealthReport:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - observed_at
      - gateway_version
      - capture_state
      - pending_events
      - oldest_pending_age_seconds
      - capture_progress_age_seconds
      properties:
        schema_version:
          type: integer
          const: 1
        observed_at: *schemaid001
        gateway_version: &schemaid004
          type: string
          pattern: ^[A-Za-z0-9._-]{1,32}$
        capture_state: &schemaid005
          type: string
          enum:
          - READY
          - WARMING_UP
          - UNAVAILABLE
        pending_events: &schemaid006
          type: integer
          minimum: 0
          maximum: 1000000
        oldest_pending_age_seconds: &schemaid007
          type: integer
          minimum: 0
          maximum: 315360000
        capture_progress_age_seconds: &schemaid008
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 315360000
    InstallationHealth:
      type: object
      additionalProperties: false
      required:
      - dispositivo_id
      - observed_at
      - received_at
      - gateway_version
      - capture_state
      - pending_events
      - oldest_pending_age_seconds
      - capture_progress_age_seconds
      properties:
        dispositivo_id:
          $ref: '#/components/schemas/DeviceId'
        observed_at: *schemaid001
        received_at: *schemaid001
        gateway_version: *schemaid004
        capture_state: *schemaid005
        pending_events: *schemaid006
        oldest_pending_age_seconds: *schemaid007
        capture_progress_age_seconds: *schemaid008
    InstallationHealthView:
      type: object
      additionalProperties: false
      required:
      - dispositivo_id
      - contact_state
      properties:
        dispositivo_id:
          $ref: '#/components/schemas/DeviceId'
        contact_state:
          type: string
          enum:
          - UNKNOWN
          - CURRENT
          - STALE
        health:
          $ref: '#/components/schemas/InstallationHealth'
    OperationalStatus:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: {type: boolean}
      examples:
        - {active: false}
        - {active: true}
    DeviceTokenRotation:
      type: object
      additionalProperties: false
      description: Corpo vazio obrigatório; a credencial é gerada exclusivamente pelo servidor.
      examples:
        - {}
    OriginId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      description: ID opaco e estável; empresa/quadra gerados pelo servidor e provisionados no gateway.
    DeviceId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,32}$'
    EventoId:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: UUID hex emitido pelo gateway atual, sem hifens; identidade global da ingestão.
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Version:
      type: string
      minLength: 1
      maxLength: 64
    NonBlankName:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '\S'
    AdminLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Validar email apos trim/lowercase; formato e dominio sao verificacoes semanticas adicionais.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          description: Validar também 12–72 bytes UTF-8 e conteudo nao inteiramente branco, sem trim/truncamento da senha pelo BCrypt.
    AdminSession:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string, minLength: 1}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 3600}
    AdminIdentity:
      type: object
      additionalProperties: false
      required: [usuario_id, email, platform_admin, empresa_ids]
      properties:
        usuario_id: {type: string, format: uuid}
        email: {type: string, format: email}
        platform_admin: {type: boolean}
        empresa_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/OriginId'}
          description: Vínculos COMPANY_ADMIN ativos; lista não concede papel de plataforma.
    RetentionDays:
      type: integer
      minimum: 1
      maximum: 30
      default: 2
      description: D04 confirmada; cada dia corresponde a 24 horas.
    EmpresaCreate:
      type: object
      additionalProperties: false
      required: [nome, active]
      properties:
        nome: {$ref: '#/components/schemas/NonBlankName'}
        active: {type: boolean}
        retencao_dias: {$ref: '#/components/schemas/RetentionDays'}
      examples:
        - {nome: Arena Exemplo, active: true, retencao_dias: 2}
    Empresa:
      type: object
      additionalProperties: false
      required: [empresa_id, nome, active, retencao_dias]
      properties:
        empresa_id: {$ref: '#/components/schemas/OriginId'}
        nome: {$ref: '#/components/schemas/NonBlankName'}
        active: {type: boolean}
        retencao_dias: {$ref: '#/components/schemas/RetentionDays'}
    CaptureProfile:
      type: object
      additionalProperties: false
      description: >-
        Janela antes/depois independente da segmentacao. Campos inteiros exigem
        token JSON inteiro, sem coercao de 1.0, string ou booleano. Valores
        numericos devem ser finitos; limites correspondem ao gateway v1.
      required: [REPLAY_BEFORE_SECONDS, REPLAY_AFTER_SECONDS, SEGMENT_DURATION_SECONDS, KEYFRAME_INTERVAL]
      properties:
        REPLAY_BEFORE_SECONDS: {type: number, minimum: 1, maximum: 600}
        REPLAY_AFTER_SECONDS: {type: number, minimum: 0, maximum: 60}
        SEGMENT_DURATION_SECONDS: {type: integer, minimum: 1, maximum: 120}
        KEYFRAME_INTERVAL: {type: integer, minimum: 1, maximum: 600}
    QuadraCreate:
      type: object
      additionalProperties: false
      required: [nome, active, timezone, perfil_captura]
      properties:
        nome: {$ref: '#/components/schemas/NonBlankName'}
        active: {type: boolean}
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: ZoneId IANA válido; validação semântica obrigatória, sem fallback do servidor.
        perfil_captura: {$ref: '#/components/schemas/CaptureProfile'}
      examples:
        - nome: Quadra Exemplo
          active: true
          timezone: America/Sao_Paulo
          perfil_captura: {REPLAY_BEFORE_SECONDS: 120, REPLAY_AFTER_SECONDS: 0, SEGMENT_DURATION_SECONDS: 60, KEYFRAME_INTERVAL: 30}
    Quadra:
      type: object
      additionalProperties: false
      required: [quadra_id, empresa_id, nome, active, timezone, perfil_captura]
      properties:
        quadra_id: {$ref: '#/components/schemas/OriginId'}
        empresa_id: {$ref: '#/components/schemas/OriginId'}
        nome: {$ref: '#/components/schemas/NonBlankName'}
        active: {type: boolean}
        timezone: {type: string, minLength: 1, maxLength: 64}
        perfil_captura: {$ref: '#/components/schemas/CaptureProfile'}
    Bucket:
      type: string
      minLength: 3
      maxLength: 63
      description: Nome de bucket privado previamente permitido pela plataforma; nunca URL/ARN recebido arbitrariamente.
      pattern: '^[a-z0-9][a-z0-9.-]+[a-z0-9]$'
    DispositivoCreate:
      type: object
      additionalProperties: false
      required: [dispositivo_id, active, bucket]
      properties:
        dispositivo_id: {$ref: '#/components/schemas/DeviceId'}
        active: {type: boolean}
        bucket: {$ref: '#/components/schemas/Bucket'}
    Dispositivo:
      type: object
      additionalProperties: false
      required: [dispositivo_id, quadra_id, empresa_id, active, bucket]
      properties:
        dispositivo_id: {$ref: '#/components/schemas/DeviceId'}
        quadra_id: {$ref: '#/components/schemas/OriginId'}
        empresa_id: {$ref: '#/components/schemas/OriginId'}
        active: {type: boolean}
        bucket: {$ref: '#/components/schemas/Bucket'}
    DispositivoIssued:
      type: object
      additionalProperties: false
      required: [dispositivo, device_token]
      properties:
        dispositivo: {$ref: '#/components/schemas/Dispositivo'}
        device_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Segredo exibido uma vez; não tem exemplo nem aparece no schema de consulta.
    ConfigSettings:
      type: object
      additionalProperties: false
      description: >-
        Allowlist do validador real gateway_captura/src/remote_config.py.
        Inteiros exigem token JSON inteiro (não 1.0, booleano ou string); JSON
        Schema sozinho não distingue 1 de 1.0. URL exige host e esquema RTSP real
        por validação semântica adicional. Omitir chave não a remove do cache v1.
      properties:
        REPLAY_BEFORE_SECONDS: {type: number, minimum: 1, maximum: 600}
        REPLAY_AFTER_SECONDS: {type: number, minimum: 0, maximum: 60}
        SEGMENT_DURATION_SECONDS: {type: integer, minimum: 1, maximum: 120}
        KEYFRAME_INTERVAL: {type: integer, minimum: 1, maximum: 600}
        CAMERA_TIMEOUT_SECONDS: {type: number, minimum: 1, maximum: 60}
        CAMERA_LATENCY_SECONDS: {type: number, minimum: 0, maximum: 60}
        MAX_PENDING_EVENTS: {type: integer, minimum: 1, maximum: 1000}
        MIN_FREE_BYTES: {type: number, minimum: 1048576, maximum: 1099511627776}
        BUFFER_QUOTA_BYTES: {type: number, minimum: 1048576, maximum: 10995116277760}
        CLIPS_QUOTA_BYTES: {type: number, minimum: 1048576, maximum: 10995116277760}
        CAMERA_SOURCE: {type: string, enum: [rtsp, dshow]}
        CAMERA_RTSP_URL: {type: string, maxLength: 2048, pattern: '^rtsps?://[^/\s]+'}
        CAMERA_RTSP_TRANSPORT: {type: string, enum: [tcp, udp]}
        CAMERA_DEVICE_NAME: {type: string, minLength: 1, maxLength: 128}
    ConfigPublish:
      type: object
      additionalProperties: false
      required: [base_version, settings]
      properties:
        base_version:
          anyOf:
            - {$ref: '#/components/schemas/Version'}
            - {type: 'null'}
        settings:
          $ref: '#/components/schemas/ConfigSettings'
          minProperties: 1
    ConfigPublication:
      type: object
      additionalProperties: false
      required: [dispositivo_id, version, settings, published_by, published_at]
      properties:
        dispositivo_id: {$ref: '#/components/schemas/DeviceId'}
        version: {$ref: '#/components/schemas/Version'}
        settings: {$ref: '#/components/schemas/ConfigSettings'}
        published_by: {type: string, format: uuid}
        published_at: {type: string, format: date-time}
    GatewayConfig:
      type: object
      additionalProperties: false
      required: [version, active, settings]
      properties:
        version: {$ref: '#/components/schemas/Version'}
        active: {type: boolean}
        settings: {$ref: '#/components/schemas/ConfigSettings'}
      examples:
        - version: quadra-001-v1
          active: true
          settings:
            CAMERA_SOURCE: rtsp
            CAMERA_RTSP_URL: rtsp://192.0.2.10/stream-confirmado
            CAMERA_RTSP_TRANSPORT: tcp
            SEGMENT_DURATION_SECONDS: 60
            KEYFRAME_INTERVAL: 30
            REPLAY_BEFORE_SECONDS: 120
            REPLAY_AFTER_SECONDS: 0
    ReplayObject:
      type: object
      additionalProperties: false
      required: [bucket, key, sha256]
      properties:
        bucket: {$ref: '#/components/schemas/Bucket'}
        key:
          type: string
          pattern: '^replays/[A-Za-z0-9_-]{1,32}/[a-f0-9]{32}\.mp4$'
          description: Conferir igualdade exata com dispositivo_id/evento_id e bucket provisionado antes de acessar storage.
        sha256: {$ref: '#/components/schemas/Sha256'}
    ReplayCreate:
      type: object
      additionalProperties: false
      required: [contrato_versao, evento_id, dispositivo_id, quadra_id, timestamp, objeto]
      properties:
        contrato_versao: {type: integer, const: 1}
        evento_id: {$ref: '#/components/schemas/EventoId'}
        dispositivo_id: {$ref: '#/components/schemas/DeviceId'}
        quadra_id: {$ref: '#/components/schemas/OriginId'}
        timestamp:
          type: string
          format: date-time
          pattern: '(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: Offset explicito; precisao maxima de microssegundos, como o cliente v1. Fracao nao representavel e rejeitada sem truncar o instante. Anos UTC de 1 a 9998.
        objeto: {$ref: '#/components/schemas/ReplayObject'}
      examples:
        - contrato_versao: 1
          evento_id: d70fd979d77d4e33a587f01bb05a58c5
          dispositivo_id: mega01
          quadra_id: quadra_001
          timestamp: '2026-10-15T15:47:57+00:00'
          objeto:
            bucket: bucket-privado
            key: replays/mega01/d70fd979d77d4e33a587f01bb05a58c5.mp4
            sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ReplayAck:
      type: object
      additionalProperties: false
      required: [evento_id, sha256]
      properties:
        evento_id: {$ref: '#/components/schemas/EventoId'}
        sha256: {$ref: '#/components/schemas/Sha256'}
      examples:
        - evento_id: d70fd979d77d4e33a587f01bb05a58c5
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    EmpresaPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Empresa'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    QuadraPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Quadra'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    DispositivoPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Dispositivo'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    AuditEntry:
      type: object
      additionalProperties: false
      required: [audit_id, correlation_id, occurred_at, actor_id, actor_type, action, resource_type, resource_id, empresa_id, outcome, code, http_status]
      description: >-
        Metadados fechados. Actor_id e UUID validado, sem email. SYSTEM em comandos
        operacionais; ANONYMOUS quando identidade nao foi autenticada. IDs de recurso
        em sucesso vem do registro persistido; recusas nao copiam IDs brutos do caminho.
        Sem payload, URL, IP, headers, token ou hash. Snapshots nao dependem de FK do recurso.
      properties:
        audit_id: {type: string, format: uuid}
        correlation_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        actor_id: {type: [string, 'null'], format: uuid}
        actor_type: {type: string, enum: [ADMIN, ANONYMOUS, SYSTEM]}
        action: {type: string, pattern: '^[A-Z_]{1,64}$'}
        resource_type: {type: string, pattern: '^[A-Z_]{1,32}$'}
        resource_id: {type: [string, 'null'], minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
        empresa_id: {anyOf: [{$ref: '#/components/schemas/OriginId'}, {type: 'null'}]}
        outcome: {type: string, enum: [SUCCESS, REFUSED, FAILED]}
        code: {type: string, pattern: '^[A-Z_]{1,64}$'}
        http_status: {type: [integer, 'null'], minimum: 100, maximum: 599}
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code:
