openapi: 3.1.0
info:
  title: ClickLance — contratos do primeiro recorte
  version: 1.0.0
  description: >-
    Contratos BE-002. BE-003–012 implementam administração, configuração remota
    e ingestão idempotente v1. BE-013–028 acrescentam jogador, biblioteca, ciclo de vida e telemetria.
    BE-026 acrescenta status operacional e rotação imediata de credenciais.
    Decisões e autorização em docs/overview_backend_refinamento.md.
    Configuração/ingestão preservam o contrato cloud v1 e o cliente existente.
    BE-007 acrescenta X-Correlation-ID gerado pelo servidor a respostas administrativas;
    erros usam o mesmo UUID em correlation_id, sem copiar payloads ou headers recebidos.
    Cadastro de empresa requer PLATFORM_ADMIN; demais ações administrativas
    requerem esse papel ou COMPANY_ADMIN com vínculo ativo à empresa do recurso.
    Validações entre campos, vínculo, IANA e tipos lexicais são semânticas adicionais.
servers:
  - url: http://127.0.0.1:8080
    description: Desenvolvimento local; TLS obrigatório fora do loopback.
security:
  - AdminBearer: []
tags:
  - {name: Administração}
  - {name: Gateway}
  - {name: Jogador}
paths:
  /api/v1/admin/sessoes:
    post:
      tags: [Administração]
      operationId: criarSessaoAdministrativa
      x-story: BE-003
      x-implementation-status: implemented
      security: []
      summary: Autenticar administrador; não cria usuário ou papel
      description: >-
        Email trim/lowercase; senha de 12–72 bytes UTF-8. JWT RS256 válido por
        3600 segundos, sem refresh. Credencial inválida e usuário inativo têm
        a mesma resposta genérica. Cache-Control no-store; sem cookies ou redirects.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLogin'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '201':
          description: Sessão persistida e JWT emitido
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/sessoes/atual:
    get:
      tags: [Administração]
      operationId: consultarSessaoAdministrativa
      x-story: BE-003
      x-implementation-status: implemented
      summary: Consultar identidade e permissões atuais
      description: JWT não substitui validação de usuário, sessão e vínculo no banco.
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Identidade administrativa sem credenciais
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminIdentity'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [Administração]
      operationId: revogarSessaoAdministrativa
      x-story: BE-003
      x-implementation-status: implemented
      summary: Revogar imediatamente a sessão autenticada
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '204':
          description: Revogação persistida; o mesmo JWT não autoriza nova requisição
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/empresas:
    post:
      tags: [Administração]
      operationId: criarEmpresa
      x-story: BE-004
      x-implementation-status: implemented
      summary: Criar empresa; somente PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmpresaCreate'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '201':
          description: Empresa persistida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Empresa'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Administração]
      operationId: listarEmpresas
      x-story: BE-004
      x-implementation-status: implemented
      summary: Listar somente empresas autorizadas, ordenadas por ID
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Página filtrada por vínculo; plataforma vê todas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpresaPage'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/empresas/{empresa_id}:
    parameters:
      - {$ref: '#/components/parameters/EmpresaId'}
    get:
      tags: [Administração]
      operationId: consultarEmpresa
      x-story: BE-004
      x-implementation-status: implemented
      summary: Consultar empresa autorizada
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Empresa sem configuração de câmera ou credenciais
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Empresa'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/empresas/{empresa_id}/quadras:
    parameters:
      - {$ref: '#/components/parameters/EmpresaId'}
    post:
      tags: [Administração]
      operationId: criarQuadra
      x-story: BE-005
      x-implementation-status: implemented
      summary: Criar quadra na empresa autorizada
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuadraCreate'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '201':
          description: Quadra persistida com empresa e fuso coerentes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quadra'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Administração]
      operationId: listarQuadras
      x-story: BE-005
      x-implementation-status: implemented
      summary: Listar quadras da empresa autorizada por ID
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Página sem URLs de câmera
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuadraPage'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/empresas/{empresa_id}/quadras/{quadra_id}:
    parameters:
      - {$ref: '#/components/parameters/EmpresaId'}
      - {$ref: '#/components/parameters/QuadraId'}
    get:
      tags: [Administração]
      operationId: consultarQuadra
      x-story: BE-005
      x-implementation-status: implemented
      summary: Consultar quadra, conferindo empresa do caminho
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Quadra autorizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quadra'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/empresas/{empresa_id}/quadras/{quadra_id}/dispositivos:
    parameters:
      - {$ref: '#/components/parameters/EmpresaId'}
      - {$ref: '#/components/parameters/QuadraId'}
    post:
      tags: [Administração]
      operationId: criarDispositivo
      x-story: BE-006
      x-implementation-status: implemented
      summary: Provisionar dispositivo vinculado à quadra autorizada
      description: >-
        Identidade global única e vínculo imutável. Token aleatório de 32 bytes,
        base64url, devolvido só nesta emissão; hash no banco. Não reapresentar
        token em retry: conflito 409 exige intervenção de provisionamento/rotação.
        Configurar DEVICE_ID, QUADRA_ID e S3_BUCKET_NAME localmente no gateway.
        Bucket deve constar em DEVICE_ALLOWED_BUCKETS no servidor; lista vazia
        retorna 503 e bucket nao permitido retorna 422. Cadastro administrativo
        em origem inativa nao habilita autenticacao do dispositivo.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispositivoCreate'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '201':
          description: Dispositivo e credencial persistidos; segredo exibido uma vez
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispositivoIssued'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Administração]
      operationId: listarDispositivos
      x-story: BE-006
      x-implementation-status: implemented
      summary: Listar dispositivos da origem autorizada por ID
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Página sem token ou hash
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispositivoPage'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/dispositivos/{dispositivo_id}:
    parameters:
      - {$ref: '#/components/parameters/DispositivoId'}
    get:
      tags: [Administração]
      operationId: consultarDispositivo
      x-story: BE-006
      x-implementation-status: implemented
      summary: Consultar dispositivo derivando a empresa pelo vínculo persistido
      description: >-
        Plataforma recebe 404 para identidade ausente. Para COMPANY_ADMIN,
        dispositivo fora do escopo ou ausente retorna o mesmo 403, sem revelar
        existencia nem origem. Consulta nao retorna token ou hash.
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Cadastro sem credenciais
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispositivo'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/empresas/{empresa_id}/auditoria:
    parameters:
      - {$ref: '#/components/parameters/EmpresaId'}
    get:
      tags: [Administração]
      operationId: listarAuditoriaEmpresa
      x-story: BE-007
      x-implementation-status: implemented
      summary: Consultar auditoria somente da empresa autorizada
      description: >-
        Plataforma ou COMPANY_ADMIN com vinculo ativo. Ordenacao por occurred_at/id
        decrescente, contagem e itens no mesmo snapshot. Nao registra leitura bem-sucedida
        como nova acao. Historico sem dados de negocio, credenciais ou corpo de requisicao.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Pagina no escopo autorizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/auditoria/{correlation_id}:
    parameters:
      - name: correlation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Administração]
      operationId: consultarAuditoriaCorrelacao
      x-story: BE-007
      x-implementation-status: implemented
      summary: Investigar uma correlacao; somente PLATFORM_ADMIN
      description: >-
        Inclui registros sem empresa ou com ator anonimo. Retorna lista vazia para
        correlacao ausente. Administrador de empresa recebe 403 mesmo que conheca o UUID.
        Nao oferece listagem global de auditoria.
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '200':
          description: Registros da correlacao solicitada
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/dispositivos/{dispositivo_id}/configuracoes:
    parameters:
      - {$ref: '#/components/parameters/DispositivoId'}
    post:
      tags: [Administração]
      operationId: publicarConfiguracao
      x-story: BE-008
      x-implementation-status: implemented
      summary: Publicar configuração versionada na origem autorizada
      description: >-
        base_version null somente na primeira publicação, depois igual à versão
        atual. Servidor gera nova versão; publica com autor/instante no mesmo
        commit. Mesclar perfil e valores anteriores antes de validar a configuração
        efetiva. Para RTSP ativo exigir URL com host; omitir chave não apaga cache.
        Não publicar quadra/bucket/DEVICE_ID como settings. Sem alteração de eventos antigos.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigPublish'}
      responses:
        '201':
          description: Publicação persistida; conteúdo sensível restrito à origem autorizada
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigPublication'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
  /api/v1/dispositivos/{dispositivo_id}/config:
    parameters:
      - {$ref: '#/components/parameters/DispositivoId'}
    get:
      tags: [Gateway]
      operationId: consultarConfiguracaoV1
      x-story: BE-008
      x-implementation-status: implemented
      security:
        - DeviceToken: []
      summary: Entregar configuração v1 para o próprio dispositivo
      description: >-
        Token autentica o dispositivo do caminho. Origem inativa retorna 403,
        inclusive se um pai estiver inativo; token inválido/revogado retorna 401.
        Sem publicação válida retorna 503. Cliente persiste inativação por 401/403.
        Resposta 200 tem somente version/active/settings, active true, sem metadados administrativos.
      responses:
        '200':
          description: Envelope exato aceito pelo gateway v1
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GatewayConfig'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/replays:
    post:
      tags: [Gateway]
      operationId: registrarReplayV1
      x-story: BE-011
      x-implementation-status: implemented
      security:
        - DeviceToken: []
      summary: Confirmar replay somente após commit durável
      description: >-
        Idempotency-Key igual a evento_id. Autenticar e autorizar origem antes
        de responder, inclusive reenvio. Registro existente idêntico retorna 200
        sem exigir objeto já purgado; divergente retorna 409. Comparar timestamp
        pelo instante. Evento novo exige objeto autorizado e SHA-256 dos bytes,
        timestamp no máximo 300 s futuro e política snapshot da primeira ingestão.
        Vencido é registrado/confirmado, sem publicação nem rejuvenescimento.
        Corridas convergem pela unicidade; objeto ausente é 503 retentável, nunca 404 terminal.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {$ref: '#/components/schemas/EventoId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplayCreate'}
      responses:
        '201':
          description: Primeiro registro durável; inclui chegada vencida
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplayAck'}
        '200':
          description: Mesmo evento e conteúdo imutável; não recria prazo/objeto
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplayAck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '415': {$ref: '#/components/responses/BadRequest'}
  /api/v1/admin/empresas/{empresa_id}/status:
    parameters:
      - {$ref: '#/components/parameters/EmpresaId'}
    patch:
      tags: [Administração]
      operationId: alterarStatusEmpresa
      x-story: BE-026
      x-implementation-status: implemented
      summary: Alterar status operacional da empresa; somente PLATFORM_ADMIN
      description: >-
        Estado explícito e repetível. Inativação recusa configuração e ingestão
        de todos os dispositivos filhos com 403 após validar a credencial, inclusive
        em reenvios de eventos já registrados. Não altera status próprios dos filhos,
        versões publicadas, origem ou histórico. A alteração e a auditoria confirmam
        na mesma transação. Cache v1 preserva inativação durante falta de rede;
        com credencial válida, próximo refresh bem-sucedido aplica reativação.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationalStatus'}
      responses:
        '200':
          description: Empresa com status persistido
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Empresa'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
