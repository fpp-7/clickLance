        O segredo aparece nesta resposta após commit, com no-store. Token antigo
        passa a receber 401, inclusive no reenvio de evento já registrado; token
        novo continua sujeito à inativação dos três níveis (403). Sem sobreposição
        ou drenagem automática: fila e cache inativo v1 exigem intervenção local.
