spring.application.name=clicklance-backend
spring.config.import=optional:file:./.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:clicklance}?connectTimeout=5
spring.datasource.username=${DB_USER:clicklance}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
spring.jmx.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Sem chaves, administracao responde 503; nunca gerar chave/senha privilegiada implicitamente.
clicklance.admin.private-key-path=${ADMIN_JWT_PRIVATE_KEY_PATH:}
clicklance.admin.public-key-path=${ADMIN_JWT_PUBLIC_KEY_PATH:}
clicklance.admin.issuer=clicklance-backend
clicklance.admin.audience=clicklance-admin

# Lista controlada pelo operador da plataforma; vazia impede emissao de dispositivo.
clicklance.devices.allowed-buckets=${DEVICE_ALLOWED_BUCKETS:}
clicklance.storage.region=${AWS_REGION:us-east-1}
clicklance.storage.endpoint=${STORAGE_ENDPOINT:}

# DEBUG global nao deve imprimir corpos de login, JWTs ou parametros SQL.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.security=INFO
logging.level.com.nimbusds=INFO
logging.level.software.amazon.awssdk=INFO
